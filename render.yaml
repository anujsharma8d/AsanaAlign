services:
  - type: web
    name: asana-align-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: DEV_MODE
        value: "false"

  - type: web
    name: asana-align-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://yoga-intelligence.onrender.com
